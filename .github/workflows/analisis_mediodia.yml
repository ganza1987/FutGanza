name: Repaso de mediodia FutGanza

# Solo actualiza cuotas y detecta valor (manda unicamente los picks NUEVOS); no
# repite el listado de la jornada, que ya llego a las 06:00 -- ver
# run_analisis.py. Corre a las 12:30 hora de Madrid. El 79 % de los picks de
# valor de FutGanza salen de este pase (a mediodia ya hay mas cuotas
# publicadas de los partidos de la tarde), por eso se mantiene.
#
# Igual que analisis_manana.yml: minutos "raros" (:17/:47), varios intentos, y
# run_analisis.py acepta cualquier hora entre las 12 y las 20 en Madrid con
# reserva diaria en la base de datos (sin duplicar).
on:
  schedule:
    - cron: '17 10 * * *'
    - cron: '47 10 * * *'
    - cron: '17 11 * * *'
    - cron: '47 11 * * *'
  workflow_dispatch:

concurrency:
  group: analisis-futganza
  cancel-in-progress: false

jobs:
  repaso:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Repaso de mediodia (cuotas + valor)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APIFOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          NOTIFY_CHAT_IDS: ${{ secrets.NOTIFY_CHAT_IDS }}
          # En una ejecucion manual se hace siempre, sin esperar a las 12:30.
          FORZAR_ANALISIS: ${{ github.event_name == 'workflow_dispatch' }}
        run: python run_analisis.py mediodia
